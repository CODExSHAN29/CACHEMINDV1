services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cachemind-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cachemind_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=cachemind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachemind_user -d cachemind_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cachemind-net

  redis:
    image: redis:7.2-alpine
    container_name: cachemind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cachemind-net

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemind-migration
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://cachemind_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cachemind_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cachemind-net

  cachemind-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemind-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://cachemind_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cachemind_db
      - AUTO_RUN_MIGRATIONS=false
      - VECTOR_BACKEND=pgvector
      - SEMANTIC_CACHE_MODE=safe
      - ALLOW_MOCK_PROVIDERS=false
      - ALLOW_MOCK_EMBEDDINGS=false
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY:?ADMIN_MASTER_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30.0
      - DB_POOL_RECYCLE=1800
      - DB_POOL_PRE_PING=true
      - PII_MASKING_ENABLED=true
      - PII_MASKING_MODE=mask
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - cachemind-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cachemind-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cachemind-gateway
    networks:
      - cachemind-net

volumes:
  postgres_data:
  redis_data:

networks:
  cachemind-net:
    driver: bridge