version: "3.8"

services:
  cachemind-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemind-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      - CACHE_BACKEND=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_URL=sqlite+aiosqlite:////app/data/cachemind.db
      - PII_MASKING_ENABLED=true
      - PII_MASKING_MODE=mask
      - DEV_TENANT_ID=dev-tenant-001
      - DEV_PROJECT_ID=dev-project-001
      - DEV_API_KEY=cm_live_development_key_1234567890abcdef
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-openai-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock-anthropic-key}
    volumes:
      - cachemind_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cachemind-net

  redis:
    image: redis:7.2-alpine
    container_name: cachemind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cachemind-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cachemind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cachemind-gateway
    networks:
      - cachemind-net

volumes:
  cachemind_data:
  redis_data:

networks:
  cachemind-net:
    driver: bridge
