[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cachemind"
version = "0.1.0"
description = "Safe, Measurable Semantic Caching Gateway for LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
    "pgvector>=0.3.0",
    "argon2-cffi>=23.1.0",
    "fastembed>=0.3.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "openai>=1.50.0",
    "prometheus-client>=0.21.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "fastembed>=0.3.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["sdk*", "helm*", "alembic*", "dashboard-app*", "docs*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
