version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cachemind-postgres-verify
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cachemind_user
      - POSTGRES_PASSWORD=cachemind_password
      - POSTGRES_DB=cachemind_db
    volumes:
      - postgres_verify_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachemind_user -d cachemind_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cachemind-verify-net

  redis:
    image: redis:7.2-alpine
    container_name: cachemind-redis-verify
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_verify_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cachemind-verify-net

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemind-migration-verify
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://cachemind_user:cachemind_password@postgres:5432/cachemind_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cachemind-verify-net

  cachemind-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemind-gateway-verify
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=verification
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://cachemind_user:cachemind_password@postgres:5432/cachemind_db
      - AUTO_RUN_MIGRATIONS=false
      - VECTOR_BACKEND=pgvector
      - SEMANTIC_CACHE_MODE=safe
      - ALLOW_MOCK_PROVIDERS=true
      - ALLOW_MOCK_EMBEDDINGS=true
      - ADMIN_MASTER_KEY=cm_verify_master_sec_09a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30.0
      - DB_POOL_RECYCLE=1800
      - DB_POOL_PRE_PING=true
      - PII_MASKING_ENABLED=true
      - PII_MASKING_MODE=mask
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - cachemind-verify-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cachemind-prometheus-verify
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cachemind-gateway
    networks:
      - cachemind-verify-net

volumes:
  postgres_verify_data:
  redis_verify_data:

networks:
  cachemind-verify-net:
    driver: bridge
