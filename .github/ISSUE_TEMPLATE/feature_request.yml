name: "💡 Feature Request"
description: "Suggest an idea or enhancement for CacheMind"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea to make CacheMind better!
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What feature or capability would you like to see added?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem & Motivation
      description: What problem does this solve or what use case does it enable?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / API Design
      description: How should this feature work from an architectural or user perspective?
